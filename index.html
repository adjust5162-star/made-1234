<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Face Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Animal Face Test</h1>
    <p>Upload an image to see if it's more like a dog or a cat.</p>
    <div class="upload-container">
        <input type="file" id="imageUpload" accept="image/*" onchange="handleImage(event)">
        <label for="imageUpload" class="upload-label">Choose Image</label>
    </div>
    <div id="image-container">
        <img id="image-preview" src="" alt="Image preview"/>
    </div>
    <button id="predict-button" type="button" onclick="predict()" disabled>Predict</button>
    <div id="label-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
