<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Face Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <div class="card-header">
            <h1>Animal Face Test</h1>
            <p>Is it a dog or a cat?</p>
        </div>

        <div class="card-body">
            <label for="imageUpload" class="upload-label">Choose an Image</label>
            <input type="file" id="imageUpload" accept="image/*" hidden>
            
            <img id="imagePreview" src="#" alt="Image preview" style="display:none; max-width: 100%; margin-top: 20px; border-radius: 8px;"/>
        </div>

        <div class="card-footer">
            <button id="predictButton" disabled>Predict</button>
            <div id="label-container"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
